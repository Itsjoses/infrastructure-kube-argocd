apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical-standalone
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical
  sources:
    # 1) Helm chart resmi Infisical
    - repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
      chart: infisical-standalone
      targetRevision: 1.8.0
          helm:
            releaseName: infisical
            valueFiles:
            - $values/infisical/values.yaml
    - repoURL: https://github.com/Itsjoses/infrastructure-kube-argocd.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true