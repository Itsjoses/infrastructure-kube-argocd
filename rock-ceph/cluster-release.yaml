apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-cluster
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    chart: rook-ceph-cluster
    repoURL: https://charts.rook.io/release
    targetRevision: v1.19.4
    helm:
      values: |
        cephClusterSpec:
          cephVersion:
            image: quay.io/ceph/ceph:v20
          crashCollector:
            disable: false
          dashboard:
            enabled: true
            ssl: true
          monitoring:
            enabled: true
          mon:
            count: 3
            allowMultiplePerNode: false
          mgr:
            count: 2
            allowMultiplePerNode: false
          network:
            provider: host
          storage:
            useAllNodes: false
            useAllDevices: false
            nodes:
              - name: worker1
                devices:
                  - name: sdb
              - name: worker2
                devices:
                  - name: sdb
              - name: worker3
                devices:
                  - name: sdb
          resources:
            mgr:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            mon:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi
            osd:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 6Gi
            mgr-sidecar:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi

        cephBlockPools:
          - name: ceph-blockpool
            spec:
              failureDomain: host
              replicated:
                size: 1 # ganti sesuai kebutuhan
            storageClass:
              enabled: true
              name: ceph-block
              isDefault: true
              reclaimPolicy: Delete
              allowVolumeExpansion: true
              volumeBindingMode: Immediate
              parameters:
                imageFormat: "2"
                imageFeatures: layering
                csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
                csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
                csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
                csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
                csi.storage.k8s.io/fstype: ext4
        cephFileSystems: []
        cephObjectStores: []
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    syncOptions:
    - ServerSideApply=true 
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true